# Until DDEV ships ddev/ddev#9006: only the in-container healthcheck may reach php-fpm
# through /phpstatus. An exact-match location takes precedence over monitoring.conf's
# regex location, which allows everyone.
location = /phpstatus {
    access_log off;
    allow 127.0.0.1;
    deny all;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
